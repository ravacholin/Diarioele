name: Compilar APK Android

on:
  workflow_dispatch:
  push:
    branches:
      - android-phase3
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Habilitar Gradle Wrapper
        run: chmod +x gradlew

      - name: Ejecutar pruebas
        id: tests
        continue-on-error: true
        run: >-
          ./gradlew testDebugUnitTest --max-workers=2
          -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"

      - name: Mostrar pruebas fallidas
        if: steps.tests.outcome == 'failure'
        run: |
          find app/build/test-results/testDebugUnitTest -name '*.xml' -exec grep -l '<failure' {} \; -exec cat {} \;
          exit 1

      - name: Analizar y compilar
        run: >-
          ./gradlew lintDebug assembleDebug assembleDebugAndroidTest --max-workers=2
          -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: DiarioClase-Android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
