name: Compilar APK Android

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag para publicar un Release con el APK (ej: v0.4.0-whisper). Vacío = solo compilar."
        required: false
        default: ""
  push:
    branches:
      - android-phase3
      - main
      - feature/phase4-whisper-recovery
      - feature/phase5-contextual-interpretation
      - "feature/phase5-task-*"
      - feature/phase5-2-quality
      - "feature/phase5-2-task-*"
      - "feature/phase6-task-*"
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - feature/phase5-contextual-interpretation
      - feature/phase5-2-quality

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Habilitar Gradle Wrapper
        run: chmod +x gradlew

      - name: Preparar modelo Whisper verificado
        run: bash scripts/prepare-whisper-model.sh

      - name: Ejecutar pruebas
        id: tests
        continue-on-error: true
        run: >-
          ./gradlew testDebugUnitTest --max-workers=2
          -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"

      - name: Mostrar pruebas fallidas
        if: steps.tests.outcome == 'failure'
        run: |
          find app/build/test-results/testDebugUnitTest -name '*.xml' -exec grep -l '<failure' {} \; -exec cat {} \;
          exit 1

      - name: Analizar y compilar
        run: >-
          ./gradlew lintDebug assembleDebug assembleDebugAndroidTest --max-workers=2
          -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: DiarioClase-Android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publicar Release con APK
        if: ${{ startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
        run: >-
          gh release create "$TAG"
          "app/build/outputs/apk/debug/app-debug.apk#DiarioClase-$TAG-debug.apk"
          --target "${{ github.sha }}"
          --title "Diario de Clase $TAG"
          --notes "APK debug de DiarioELE generado por GitHub Actions. Consultar el protocolo de prueba y el handoff de la fase correspondiente antes de instalarlo en el Moto g max."
          --prerelease
